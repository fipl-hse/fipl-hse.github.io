name: Documentation Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-admin
  cancel-in-progress: true

jobs:
  install-dependencies:
    name: Installing dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v7
      - name: Setup FIPL environment
        uses: fipl-hse/setup-env-action@v0.13.3
      - name: Confirming everything is OK
        run: |
          ls -la venv

  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 7
    needs: [ install-dependencies ]

    steps:
      - uses: actions/checkout@v7
      - name: Setup FIPL environment
        uses: fipl-hse/setup-env-action@v0.13.3
      - name: Build Documentation
        run: |
          source venv/bin/activate
          which python
          export PYTHONPATH=$(pwd):$PYTHONPATH
          rm -rf source/build/
          sphinx-build -W -n -b html source/ source/build/

  spellcheck:
      name: Spellcheck
      runs-on: ubuntu-latest
      timeout-minutes: 4
      needs: [ install-dependencies ]
      steps:
        - uses: actions/checkout@v7
        - name: Install Aspell
          run: |
            sudo sed -i '1d' /etc/apt/apt-mirrors.txt
            sudo apt-get update
            sudo apt-get install aspell aspell-en aspell-ru
        - name: Setup FIPL environment
          uses: fipl-hse/setup-env-action@v0.13.3
        - name: Spell check
          run: |
            source venv/bin/activate
            export PYTHONPATH=$(pwd)
            fiplconfig.check_spelling
